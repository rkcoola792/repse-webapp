services:
  - type: web
    name: repse-webapp
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_APP_BASE_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://repse-backend-latest.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
