services:
  - type: web
    name: repse-webapp
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api
      - key: API_BASE_URL
        value: https://repse-backend-latest.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://repse-webapp.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_ORDER_DISCOUNT_PERCENT
        value: "20"
      - key: NEXT_PUBLIC_ORDER_DELIVERY_FEE
        value: "15"
